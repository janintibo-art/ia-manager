name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Unit tests and quick interface smoke test
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        run: |
          pip show PyQt6 PyQt6-Qt6
          python -u -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u tests/build_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build EXE
        timeout-minutes: 15
        run: pyinstaller --onefile --windowed --name ia_manager --icon assets/branding/ia_manager.ico --add-data "assets/branding;assets/branding" --hidden-import pkgutil --hidden-import anyio._backends._asyncio main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ia_manager
          path: dist/ia_manager.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IA Manager v1.0.${{ github.run_number }}
          files: dist/ia_manager.exe
