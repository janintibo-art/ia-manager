name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Smoke test (Qt + ouverture de la fenetre)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip show PyQt6 PyQt6-Qt6
          python -c "from PyQt6.QtCore import PYQT_VERSION_STR, QT_VERSION_STR; print('PyQt', PYQT_VERSION_STR, 'Qt', QT_VERSION_STR)"
          python -c "import sys; from PyQt6.QtWidgets import QApplication; app = QApplication(sys.argv); from src.ui.main_window import MainWindow; w = MainWindow(); w.show(); print('Fenetre OK')"

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name ia_manager --hidden-import pkgutil main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ia_manager
          path: dist/ia_manager.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IA Manager v1.0.${{ github.run_number }}
          files: dist/ia_manager.exe
